# CindrixCraft server settings (off-grid defaults)

# Never announce to the public server list; we run with no internet
server_announce = false

server_name = CindrixCraft
server_description = Off-grid CindrixCraft server
motd = Welcome to CindrixCraft

# Default Luanti port (UDP)
port = 30000

max_users = 10

# Minecraft-style survival
enable_damage = true
creative_mode = false
enable_pvp = false
