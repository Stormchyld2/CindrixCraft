name: windows-engine

# Builds CindrixCraft for Windows 64-bit: our fork of the Luanti engine (engine/luanti),
# cross-compiled with MinGW the same way upstream Luanti does, with the CindrixCraft
# game (games/cindrixcraft) bundled inside so it runs with no setup.
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/luanti/**'
      - 'games/cindrixcraft/**'
      - '.github/workflows/windows-engine.yml'

permissions:
  contents: write

jobs:
  mingw64:
    name: Windows 64-bit (MinGW cross-compiler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Catch Lua typos in our own code before they reach a player
      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for f in games/cindrixcraft/mods/CINDRIX/*/*.lua \
                   engine/luanti/builtin/mainmenu/tab_online.lua \
                   engine/luanti/builtin/mainmenu/tab_local.lua \
                   engine/luanti/builtin/mainmenu/tab_about.lua; do
            echo "checking $f"
            luac5.4 -p "$f"
          done

      - name: Install compiler
        working-directory: engine/luanti
        run: |
          source ./util/ci/common.sh
          install_mingw_deps '64' 'false'
          sudo ./util/buildbot/download_toolchain.sh /usr

      - name: Build engine
        working-directory: engine/luanti
        run: |
          set -o pipefail
          EXISTING_MINETEST_DIR=$PWD \
          ./util/buildbot/buildwin64.sh B 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Bundle the game
        run: |
          set -e
          mkdir -p artifact work
          unzip -q -d work engine/luanti/B/build/*.zip
          dir=$(echo work/*-win64)
          rm -rf "$dir/games/devtest"
          mkdir -p "$dir/games"
          cp -a games/cindrixcraft "$dir/games/cindrixcraft"
          out=CindrixCraft-$(basename "$dir" | sed 's/^cindrixcraft-//')
          mv "$dir" "work/$out"
          (cd work && zip -q -r "../artifact/$out.zip" "$out")
          ls -la artifact

      # Check that the resulting binary runs (DLLs etc.) and sees the game
      - name: Runtime test
        run: |
          dest=$(mktemp -d)
          unzip -q -d "$dest" artifact/*.zip
          cd "$dest"/CindrixCraft-*-win64
          ls bin games
          test -f games/cindrixcraft/game.conf
          wine bin/cindrixcraft.exe --version

      # archive: false uploads the zip as it is, so the download is one zip, not a zip in a zip
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: artifact/*.zip
          if-no-files-found: error

      # Debug aid: publish the end of the build log on its own branch when something fails
      - name: Push the log tail to the build-logs branch
        if: failure()
        run: |
          d=$(mktemp -d)
          tail -n 300 "$RUNNER_TEMP/build.log" > "$d/build-log-tail.txt" || true
          cd "$d"
          git init -q -b build-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add build-log-tail.txt
          git commit -q -m "Build log for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
