name: windows-engine

# Builds the CindrixCraft engine (our fork of Luanti in engine/luanti) for Windows 64-bit
# with the MinGW cross-compiler, the same way upstream Luanti does.
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/luanti/**'
      - '.github/workflows/windows-engine.yml'

permissions:
  contents: write

jobs:
  mingw64:
    name: Windows 64-bit (MinGW cross-compiler)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine/luanti
    steps:
      - uses: actions/checkout@v7

      - name: Install compiler
        run: |
          source ./util/ci/common.sh
          install_mingw_deps '64' 'false'
          sudo ./util/buildbot/download_toolchain.sh /usr

      - name: Build
        run: |
          set -o pipefail
          EXISTING_MINETEST_DIR=$PWD \
          ./util/buildbot/buildwin64.sh B 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p artifact
          cp -v B/build/*.zip artifact/

      - name: Keep the build log
        if: always()
        run: tail -n 300 "$RUNNER_TEMP/build.log" > "$GITHUB_WORKSPACE/build-log-tail.txt" || true

      # Publish the log tail on its own branch so it can be read without downloading artifacts
      - name: Push the log tail to the build-logs branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          d=$(mktemp -d)
          cp build-log-tail.txt "$d/build-log-tail.txt"
          cd "$d"
          git init -q -b build-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add build-log-tail.txt
          git commit -q -m "Build log for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs

      - name: Keep the build log
        if: always()
        run: tail -n 300 "$RUNNER_TEMP/build.log" > "$GITHUB_WORKSPACE/build-log-tail.txt" || true

      # Publish the log tail on its own branch so it can be read without downloading artifacts
      - name: Push the log tail to the build-logs branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          d=$(mktemp -d)
          cp build-log-tail.txt "$d/build-log-tail.txt"
          cd "$d"
          git init -q -b build-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add build-log-tail.txt
          git commit -q -m "Build log for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs

      # Check that the resulting binary runs (DLLs etc.)
      - name: Runtime test
        run: |
          dest=$(mktemp -d)
          unzip -q -d "$dest" artifact/*.zip
          cd "$dest"/*-win64
          ls bin
          wine bin/cindrixcraft.exe --version

      - uses: actions/upload-artifact@v7
        with:
          name: cindrixcraft-win64
          path: engine/luanti/artifact/*.zip
          if-no-files-found: error
